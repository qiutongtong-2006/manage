{% extends "base.html" %}
{% block title %}系统异常{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-danger fw-bold">500</div>
    <h4 class="mt-3">{{ message or '服务器内部错误' }}</h4>
    <p class="text-muted">若问题持续出现，请检查 MySQL 服务是否启动、config.py 中的数据库配置是否正确。</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>返回首页</a>
</div>
{% endblock %}
